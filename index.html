<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamX Project</title>
<meta name="description" content="StreamX, StreamXBot and WebX.">
<meta name="theme-color" content="#0c0c0c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ebeae5" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0c0c0c;--surface:#151515;--text:#eeede8;--muted:#8c8b85;--line:#ffffff1a;--line-2:#ffffff30;
  --accent:#ff6a13;--accent-text:#ff7d33;--ink:#0c0c0c;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
@media(prefers-color-scheme:light){:root{
  color-scheme:light;
  --bg:#ebeae5;--surface:#f6f5f1;--text:#0c0c0c;--muted:#5f5e59;--line:#0000001a;--line-2:#00000030;
  --accent:#ff5b00;--accent-text:#c94400;
}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
h1,h2,p{margin:0}
.wrap{width:100%;max-width:1100px;margin:0 auto;padding:0 32px}
.mono{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em}

header .wrap{display:flex;align-items:center;justify-content:space-between;height:72px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-stretch:125%;font-weight:800;font-size:16px;text-transform:uppercase}
.brand img{width:30px;height:30px}
.gh{color:var(--muted);transition:color .2s}
.gh:hover{color:var(--text)}

main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:72px 0}
.label{display:flex;align-items:center;gap:12px;color:var(--muted)}
.label:after{content:'';width:40px;height:1px;background:var(--line-2)}
h1{margin-top:20px;font-stretch:125%;font-weight:800;text-transform:uppercase;font-size:clamp(40px,8vw,104px);line-height:.9;letter-spacing:-.02em}
h1 span{color:var(--accent)}

.grid{display:grid;grid-template-columns:repeat(3,1fr);margin-top:64px;border-top:1px solid var(--line-2)}
.item{display:flex;flex-direction:column;padding:24px 24px 28px;border-right:1px solid var(--line-2)}
.item:first-child{padding-left:0}
.item:last-child{border-right:0}
.item .num{color:var(--accent-text)}
.item h2{margin-top:40px;font-stretch:125%;font-weight:800;text-transform:uppercase;font-size:clamp(24px,2.6vw,32px);letter-spacing:-.01em}
.item p{margin-top:6px;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:28px}
.links a{padding:8px 12px;border:1px solid var(--line-2);border-radius:3px;transition:background .2s,color .2s,border-color .2s}
.links a:hover{border-color:var(--text)}
.links .primary{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.links .primary:hover{background:var(--text);border-color:var(--text);color:var(--bg)}

footer .wrap{display:flex;justify-content:space-between;padding-top:20px;padding-bottom:24px;border-top:1px solid var(--line);color:var(--muted)}

@media(max-width:760px){
  .wrap{padding:0 16px}
  main{padding:48px 0}
  .grid{grid-template-columns:1fr;margin-top:44px}
  .item,.item:first-child{padding:22px 0 26px;border-right:0;border-bottom:1px solid var(--line-2)}
  .item h2{margin-top:18px}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="./"><img src="logo.svg" alt="">StreamX</a>
    <a class="gh mono" href="https://github.com/StreamXProject">GitHub ↗</a>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="label mono">StreamX Project</div>
    <h1>Music,<br><span>your way.</span></h1>

    <div class="grid">
      <div class="item">
        <span class="num mono">01 · Android</span>
        <h2>StreamX</h2>
        <p>Music player</p>
        <div class="links mono">
          <a class="primary" href="https://github.com/StreamXProject/StreamX/releases/latest">Download</a>
          <a href="https://streamxproject.github.io/StreamX/">Website</a>
          <a href="https://github.com/StreamXProject/StreamX">Source</a>
        </div>
      </div>

      <div class="item">
        <span class="num mono">02 · Server</span>
        <h2>StreamXBot</h2>
        <p>Self-hosted library</p>
        <div class="links mono">
          <a class="primary" href="https://render.com/deploy?repo=https://github.com/StreamXProject/StreamXBot">Deploy</a>
          <a href="https://github.com/StreamXProject/StreamXBot">Source</a>
        </div>
      </div>

      <div class="item">
        <span class="num mono">03 · Web</span>
        <h2>WebX</h2>
        <p>Web player</p>
        <div class="links mono">
          <a class="primary" href="https://github.com/StreamXProject/WebX">Source</a>
        </div>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap mono"><span>StreamX Project</span><span>2026</span></div>
</footer>
</body>
</html>
